; All Factions Structural Fix V1
; Additive-only OCL repairs. Existing OCLs and object logic are untouched.

; America Libra has no dedicated dead-hull object in the shipped INI.
; Preserve a lightweight generic tank death effect using only known assets.
ObjectCreationList OCL_LibraTankDeathEffectSimple
  CreateDebris
    ModelNames = AVScrap2 AVScrap3 AVScrap4 AVScrap5
    Count = 4
    Mass = 5.0
    Disposition = SEND_IT_FLYING
    DispositionIntensity = 0.5
  End
  CreateObject
    ObjectNames = OilPoolGrowingObject
    Offset = X:0.0 Y:0.0 Z:1.0
    Disposition = ON_GROUND_ALIGNED
  End
End

; Gamma toxic infantry exists as an ObjectReskin but its OCL was missing.
ObjectCreationList OCL_ToxicInfantryGamma
  CreateObject
    ObjectNames = ToxicInfantryGamma
    Disposition = LIKE_EXISTING
    SkipIfSignificantlyAirborne = Yes
  End
End

