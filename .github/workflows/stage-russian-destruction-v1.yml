name: Stage verified Russian destruction overlay once
on:
  push:
    branches: [feat/russian-building-destruction-v1]
    paths: [.github/workflows/stage-russian-destruction-v1.yml]
permissions:
  contents: write
jobs:
  stage-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/russian-building-destruction-v1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch originals and immutable validation baseline
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='*.big' --exclude=''
          git fetch --depth=1 origin 670b62f10f39ffe9016fa7f4e529816fa08ef460
          git lfs fetch origin 670b62f10f39ffe9016fa7f4e529816fa08ef460 --include='!!ProjectXRe_INI.big' --exclude=''
      - name: Build and validate only the new destruction archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_russian_destruction.py
          MOD_ARCHIVE_TESTS=1 python -m unittest discover -s tests -v
          baseline="$(git rev-parse --git-dir)/lfs/objects/83/c6/83c6616cbf7a45f0979edebd34d22a157d76751d03359bf62e62ca184d92bb25"
          python scripts/validate_mod.py --baseline "$baseline"
      - name: Commit only the verified LFS overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '!!!!ProjectXRe_RussianDestructionV1.big'
          test "$(git diff --cached --name-only)" = '!!!!ProjectXRe_RussianDestructionV1.big'
          git commit -m 'fx: stage verified Russian building destruction BIG'
          git push origin HEAD:feat/russian-building-destruction-v1
