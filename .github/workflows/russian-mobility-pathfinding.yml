name: Russian Mobility Pathfinding CI

on:
  push:
    branches:
      - analysis/russian-mobility-pathfinding
  pull_request:
    branches:
      - analysis/russian-dependency-map
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: russian-mobility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobility-audit:
    name: Audit Russian mobility and formation wiring
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout without full LFS download
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Download only INI and CloseINI archives
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='!!ProjectXRe_INI.big,!ProjectXRe_CloseINI.big' --exclude=''

      - name: Run Russian mobility audit
        run: |
          python3 tools/ci/russian_mobility_audit.py \
            '!!ProjectXRe_INI.big' \
            '!ProjectXRe_CloseINI.big' \
            --out ci-out/russian-mobility

      - name: Print mobility report
        shell: bash
        run: |
          set -euo pipefail
          sed -n '1,320p' ci-out/russian-mobility/russian-mobility-audit.md

      - name: Upload mobility audit
        uses: actions/upload-artifact@v4
        with:
          name: projectxre-russian-mobility-audit
          path: ci-out/russian-mobility/
          if-no-files-found: error
          retention-days: 14
