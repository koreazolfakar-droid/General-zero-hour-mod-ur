name: Mod archive and reference CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mod-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reject malformed archives and invalid definitions
        run: python -m unittest discover -s tests -v
  archive-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download shipped archives, both overlays and immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='*.big' --exclude=''
          git fetch --depth=1 origin 670b62f10f39ffe9016fa7f4e529816fa08ef460
          git lfs fetch origin 670b62f10f39ffe9016fa7f4e529816fa08ef460 --include='!!ProjectXRe_INI.big' --exclude=''
      - name: Verify references, all archive indexes and byte preservation
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git rev-parse --git-dir)/lfs/objects/83/c6/83c6616cbf7a45f0979edebd34d22a157d76751d03359bf62e62ca184d92bb25"
          MOD_ARCHIVE_TESTS=1 python -m unittest discover -s tests -v
          mkdir -p "$RUNNER_TEMP/verified-mod"
          python scripts/validate_mod.py --baseline "$baseline" --report "$RUNNER_TEMP/verified-mod/mod-validation.json"
          cp '!!ProjectXRe_INI.big' "$RUNNER_TEMP/verified-mod/!!ProjectXRe_INI.big"
          cp '!!!ProjectXRe_RussianVisualsV1.big' "$RUNNER_TEMP/verified-mod/!!!ProjectXRe_RussianVisualsV1.big"
          cp '!!!!ProjectXRe_RussianDestructionV1.big' "$RUNNER_TEMP/verified-mod/!!!!ProjectXRe_RussianDestructionV1.big"
          cp docs/visuals/*.jpg "$RUNNER_TEMP/verified-mod/"
          cp visuals/v1/INSTALL.md "$RUNNER_TEMP/verified-mod/INSTALL-visuals.md"
          cp effects/v1/INSTALL.md "$RUNNER_TEMP/verified-mod/INSTALL-destruction.md"
          echo 'PASS: 9 base archives + 7 DDS entries + 16 destruction entries, 22759 total entries. Original archives preserved. Finite building effects and unchanged gameplay bytes verified. Static validation only; game/device QA pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified installable archives, visual previews and validation report
        uses: actions/upload-artifact@v4
        with:
          name: projectx-russian-mod-verified
          path: ${{ runner.temp }}/verified-mod/
          if-no-files-found: error
          retention-days: 30
