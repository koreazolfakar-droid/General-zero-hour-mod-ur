; The Ogre already requests this list on death and ships RVOgre_D1.W3D.
; Use its own wreck mesh; do not substitute another tank or add repair abilities.
ObjectCreationList OCL_OgreTankDeathEffect
  CreateDebris
    ModelNames = RVOgre_D1
    Offset = X:0 Y:0 Z:0
    Mass = 50.0
    Count = 1
    Disposition = SEND_IT_FLYING
    DispositionIntensity = 0.1
    BounceSound = DebrisBigMetal
  End
End
